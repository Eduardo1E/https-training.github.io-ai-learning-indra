<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Assisted Engineering – Learning Path</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700&display=swap');

:root {
  --bg: #0b0e17;
  --panel: #111420;
  --card: #161b2e;
  --border: #1e2540;
  --accent: #4f8ef7;
  --accent2: #7c3aed;
  --green: #22d3a5;
  --yellow: #f59e0b;
  --red: #ef4444;
  --text: #e2e8f0;
  --muted: #64748b;
  --sidebar-w: 280px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
  height: 48px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}
.topbar-logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.topbar-tag {
  font-size: 10px;
  background: rgba(79,142,247,0.12);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid rgba(79,142,247,0.3);
  font-family: 'JetBrains Mono', monospace;
}
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}
.progress-global {
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}
.progress-bar-mini {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-mini-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* ── LAYOUT ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-section-title {
  font-size: 9px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 16px 16px 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  position: relative;
}
.nav-item:hover { background: rgba(79,142,247,0.06); }
.nav-item.active {
  background: rgba(79,142,247,0.1);
  border-left-color: var(--accent);
}
.nav-item.completed .nav-icon { background: rgba(34,211,165,0.15); color: var(--green); }
.nav-item.locked { opacity: 0.4; cursor: not-allowed; }
.nav-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: rgba(79,142,247,0.12);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
}
.nav-label { flex: 1; }
.nav-label-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.nav-label-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 1px;
}
.nav-check {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  flex-shrink: 0;
}
.nav-item.completed .nav-check {
  background: var(--green);
  border-color: var(--green);
  color: #000;
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--border);
}
.xp-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 6px;
  font-family: 'JetBrains Mono', monospace;
}
.xp-bar {
  height: 6px;
  background: var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 6px;
  transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
}

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TABS ── */
.tabs {
  display: flex;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  gap: 0;
  flex-shrink: 0;
}
.tab {
  padding: 12px 20px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── CONTENT AREA ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
}

/* ── MODULE HEADER ── */
.module-header {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}
.module-num {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  flex-shrink: 0;
}
.module-meta {}
.module-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.module-desc {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.5;
}

/* ── VIDEO BLOCK ── */
.video-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
}
.video-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.video-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.video-title-bar {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
}
.video-player {
  position: relative;
  padding-bottom: 56.25%;
  background: #000;
}
.video-player iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
}

/* ── CONCEPTS ── */
.concepts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.concept-chip {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.concept-chip span { font-size: 14px; }

/* ── QUIZ SECTION ── */
.quiz-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  animation: fadeUp 0.3s ease;
}
.quiz-header {
  background: linear-gradient(90deg, rgba(79,142,247,0.15), rgba(124,58,237,0.1));
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}
.quiz-header-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: rgba(79,142,247,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.quiz-header-text {}
.quiz-header-title { font-size: 14px; font-weight: 700; }
.quiz-header-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.quiz-progress-text {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent);
}

.quiz-body { padding: 24px; }
.question-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.question-text {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 20px;
  color: var(--text);
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 13px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option:hover { border-color: var(--accent); background: rgba(79,142,247,0.06); }
.option.selected { border-color: var(--accent); background: rgba(79,142,247,0.12); }
.option.correct { border-color: var(--green); background: rgba(34,211,165,0.1); color: var(--green); }
.option.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); color: var(--red); }
.option-letter {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.option.selected .option-letter { background: var(--accent); color: #fff; }
.option.correct .option-letter { background: var(--green); color: #000; }
.option.wrong .option-letter { background: var(--red); color: #fff; }

.quiz-feedback {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.correct-fb { background: rgba(34,211,165,0.1); border: 1px solid rgba(34,211,165,0.3); color: var(--green); }
.quiz-feedback.wrong-fb { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

.quiz-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.q-progress-dots { display: flex; gap: 6px; }
.q-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}
.q-dot.done { background: var(--green); }
.q-dot.current { background: var(--accent); transform: scale(1.3); }

/* ── BUTTONS ── */
.btn {
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Sora', sans-serif;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: #3b7de8; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-success {
  background: var(--green);
  color: #000;
  font-weight: 700;
}
.btn-success:hover { opacity: 0.9; transform: translateY(-1px); }

/* ── SCORE CARD ── */
.score-card {
  text-align: center;
  padding: 40px 24px;
  animation: fadeUp 0.4s ease;
}
.score-circle {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  position: relative;
}
.score-circle::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
.score-num { font-size: 36px; font-weight: 700; color: var(--text); }
.score-total { font-size: 13px; color: var(--muted); }
.score-label { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.score-message { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
.badges { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid;
}
.badge-gold { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.4); color: var(--yellow); }
.badge-blue { background: rgba(79,142,247,0.1); border-color: rgba(79,142,247,0.4); color: var(--accent); }
.badge-green { background: rgba(34,211,165,0.1); border-color: rgba(34,211,165,0.4); color: var(--green); }

/* ── COMPLETION SCREEN ── */
.completion-screen {
  text-align: center;
  padding: 60px 24px;
  animation: fadeUp 0.5s ease;
  display: none;
}
.completion-screen.show { display: block; }
.completion-icon { font-size: 64px; margin-bottom: 20px; }
.completion-title { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
.completion-sub { font-size: 14px; color: var(--muted); max-width: 480px; margin: 0 auto 32px; line-height: 1.6; }
.final-stats {
  display: flex; justify-content: center; gap: 40px; margin-bottom: 32px;
}
.final-stat { text-align: center; }
.final-stat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.final-stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── NOTIFICATION ── */
.notif {
  position: fixed;
  top: 60px; right: 20px;
  background: var(--card);
  border: 1px solid var(--green);
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 13px;
  color: var(--green);
  display: flex; align-items: center; gap: 10px;
  transform: translateX(200%);
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.notif.show { transform: translateX(0); }
</style>
</head>

<div class="layout">

<script>
// ─── DATA ───────────────────────────────────────────────────────────────
const modules = [
  {
    num: "01",
    title: "Entender el Engineering Harness",
    desc: "Comprende qué es un AI Engineering Harness y cómo funciona Claude Code internamente.",
    videoId: "I82j7AzMU80",
    videoUrl: "https://www.youtube.com/watch?v=I82j7AzMU80",
    videoTitle: "How does Claude Code actually work? — Theo.gg",
    concepts: [
      { icon: "🧠", text: "Engineering Harness" },
      { icon: "🤖", text: "Agent Harness" },
      { icon: "📐", text: "AI Model" },
      { icon: "🪟", text: "Context Window" },
      { icon: "🔧", text: "Tool Use" },
      { icon: "💬", text: "Prompting" },
      { icon: "🏗️", text: "Context Engineering" },
    ],
    quiz: [
      {
        q: "¿Qué es un Engineering Harness en el contexto de IA?",
        opts: ["Un framework para hacer deployment de modelos en producción","Una capa de software que conecta el AI model con herramientas, contexto y flujo de trabajo del desarrollador","Un servidor para ejecutar modelos de lenguaje localmente","Un sistema de logging para auditar las respuestas de la IA"],
        correct: 1,
        explain: "Un Engineering Harness es la capa que orquesta el AI model con herramientas reales (filesystem, terminal, APIs) y el contexto del proyecto, permitiendo al desarrollador trabajar con IA de forma integrada."
      },
      {
        q: "¿Qué determina la calidad de las respuestas del AI model en un harness?",
        opts: ["La velocidad de la conexión a internet","La cantidad de RAM disponible en el servidor","La calidad del contexto y el prompting que recibe el modelo","La versión del sistema operativo del desarrollador"],
        correct: 2,
        explain: "El modelo es tan bueno como el contexto que recibe. Context engineering y prompting de calidad son los factores clave que determinan la utilidad de las respuestas."
      },
      {
        q: "¿Cuál es la principal limitación de la Context Window?",
        opts: ["Solo puede procesar texto, no código","Tiene un tamaño máximo de tokens: si se supera, el modelo pierde información previa","No permite hacer preguntas de seguimiento","Solo funciona con proyectos de menos de 100 archivos"],
        correct: 1,
        explain: "La context window tiene un límite de tokens. Cuando se llena, el modelo empieza a olvidar información anterior, lo que degrada la calidad de las respuestas. Por eso el manejo del contexto es crítico."
      },
      {
        q: "¿Qué significa 'Tool Use' en un AI Harness como Claude Code?",
        opts: ["La capacidad del modelo de aprender nuevas habilidades automáticamente","La habilidad del AI de invocar funciones reales: leer archivos, ejecutar comandos, buscar en internet","El proceso de actualizar los pesos del modelo con datos nuevos","La interfaz gráfica para interactuar con el AI"],
        correct: 1,
        explain: "Tool Use permite al AI ejecutar acciones reales en el entorno: leer/escribir archivos, correr bash, llamar APIs. Esto es lo que transforma al modelo de un chatbot en un agente de engineering."
      },
      {
        q: "¿Cómo se diferencia Claude Code de un chatbot tradicional de IA?",
        opts: ["Claude Code solo sirve para Python, los chatbots son multi-lenguaje","Claude Code actúa como agente: puede leer el codebase, ejecutar comandos y modificar archivos de forma autónoma","Los chatbots son más rápidos porque no necesitan tool use","No hay diferencia significativa, ambos generan texto"],
        correct: 1,
        explain: "Claude Code es un Engineering Harness que opera como agente: tiene acceso al filesystem, terminal y herramientas del proyecto. Un chatbot solo genera texto sin interactuar con el entorno real."

function loadModule(idx) {
  const navEl = document.getElementById('nav-' + idx);
  if (navEl.classList.contains('locked')) return;
  currentModule = idx;
  currentTab = 'video';
  updateNav();
  switchTabVisual('video');
  renderContent();
}

function updateNav() {
  modules.forEach((_, i) => {
    const el = document.getElementById('nav-' + i);
    const check = document.getElementById('check-' + i);
    el.classList.remove('active', 'completed', 'locked');

    if (i === 0 || moduleStates[i - 1].completed) {
      el.classList.remove('locked');
    } else {
      el.classList.add('locked');
    }

    if (moduleStates[i].completed) el.classList.add('completed');
    if (i === currentModule) el.classList.add('active');

    check.style.display = moduleStates[i].completed ? 'flex' : 'none';
  });
}

// ─── TABS ─────────────────────────────────────────────────────────────────
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderContent();
}

function switchTabVisual(tab) {
  const tabs = document.querySelectorAll('.tab');
  const map = { video: 0, quiz: 1, notes: 2 };
  tabs.forEach((t, i) => {
    t.classList.toggle('active', i === map[tab]);
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function renderContent() {
  const m = modules[currentModule];
  const c = document.getElementById('mainContent');

  if (currentTab === 'video') {
    c.innerHTML = `
      <div class="module-header">
        <div class="module-num">${m.num}</div>
        <div class="module-meta">
          <div class="module-title">${m.title}</div>
          <div class="module-desc">${m.desc}</div>
        </div>
      </div>
      <div class="video-block">
        <div class="video-header">
          <div class="video-dot"></div>
          <div class="video-title-bar">${m.videoTitle}</div>
        </div>
        <div class="video-player" style="cursor:pointer;" onclick="window.open('${m.videoUrl}','_blank')">
          <img 
            src="https://img.youtube.com/vi/${m.videoId}/maxresdefault.jpg"
            onerror="this.src='https://img.youtube.com/vi/${m.videoId}/hqdefault.jpg'"
            style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;"
            alt="Video thumbnail"
          />
          <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
            <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,0,0,0.9);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(0,0,0,0.5);transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div style="text-align:center;">
              <div style="color:#fff;font-size:14px;font-weight:600;font-family:'Sora',sans-serif;">Ver video en YouTube</div>
              <div style="color:rgba(255,255,255,0.6);font-size:11px;margin-top:4px;font-family:'JetBrains Mono',monospace;">Se abrirá en una nueva pestaña</div>
            </div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:4px;">
        <button class="btn btn-primary" onclick="goToQuiz()">⚡ Ir al Quiz del módulo</button>
        ${moduleStates[currentModule].completed ? '<span style="color:var(--green);font-size:13px;display:flex;align-items:center;gap:6px;">✓ Módulo completado</span>' : ''}
      </div>`;
  } else if (currentTab === 'notes') {
    c.innerHTML = `
      <div class="module-header">
        <div class="module-num">${m.num}</div>
        <div class="module-meta">
          <div class="module-title">Conceptos clave</div>
          <div class="module-desc">Términos esenciales de este módulo</div>
        </div>
      </div>
      <div class="concepts-grid">
        ${m.concepts.map(c => `<div class="concept-chip"><span>${c.icon}</span>${c.text}</div>`).join('')}
      </div>
      <div style="margin-top:16px;">
        <button class="btn btn-primary" onclick="goToQuiz()">⚡ Ir al Quiz</button>
      </div>`;
  } else if (currentTab === 'quiz') {
    if (moduleStates[currentModule].quizDone) {
      renderScoreCard();
    } else {
      renderQuiz();
    }
  }
}

function goToQuiz() {
  currentTab = 'quiz';
  switchTabVisual('quiz');
  quizState = { current: 0, answered: false, selected: null, correctCount: 0 };
  renderContent();
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────
function renderQuiz() {
  const m = modules[currentModule];
  const q = m.quiz[quizState.current];
  const total = m.quiz.length;
  const c = document.getElementById('mainContent');

  const dots = m.quiz.map((_, i) => {
    let cls = 'q-dot';
    if (i < quizState.current) cls += ' done';
    if (i === quizState.current) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  c.innerHTML = `
    <div class="quiz-section">
      <div class="quiz-header">
        <div class="quiz-header-icon">⚡</div>
        <div class="quiz-header-text">
          <div class="quiz-header-title">Quiz – ${m.title}</div>
          <div class="quiz-header-sub">Valida tu comprensión del módulo</div>
        </div>
        <div class="quiz-progress-text">${quizState.current + 1} / ${total}</div>
      </div>
      <div class="quiz-body">
        <div class="question-num">PREGUNTA ${quizState.current + 1} DE ${total}</div>
        <div class="question-text">${q.q}</div>
        <div class="options" id="options">
          ${q.opts.map((opt, i) => `
            <div class="option" id="opt-${i}" onclick="selectOption(${i})">
              <div class="option-letter">${['A','B','C','D'][i]}</div>
              ${opt}
            </div>`).join('')}
        </div>
        <div class="quiz-feedback" id="feedback"></div>
        <div class="quiz-nav">
          <div class="q-progress-dots">${dots}</div>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
            ${quizState.current < total - 1 ? 'Siguiente →' : 'Ver resultados'}
          </button>
        </div>
      </div>
    </div>`;
}

function selectOption(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  quizState.selected = idx;

  const m = modules[currentModule];
  const q = m.quiz[quizState.current];
  const correct = q.correct;
  const feedback = document.getElementById('feedback');

  document.querySelectorAll('.option').forEach((el, i) => {
    if (i === correct) el.classList.add('correct');
    else if (i === idx && idx !== correct) el.classList.add('wrong');
  });

  if (idx === correct) {
    quizState.correctCount++;
    feedback.className = 'quiz-feedback correct-fb show';
    feedback.innerHTML = `✓ Correcto — ${q.explain}`;
  } else {
    feedback.className = 'quiz-feedback wrong-fb show';
    feedback.innerHTML = `✗ Incorrecto — La respuesta correcta es <strong>${['A','B','C','D'][correct]}</strong>. ${q.explain}`;
  }

  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  const m = modules[currentModule];
  if (quizState.current < m.quiz.length - 1) {
    quizState.current++;
    quizState.answered = false;
    quizState.selected = null;
    renderQuiz();
  } else {
    // Finished quiz
    const score = quizState.correctCount;
    moduleStates[currentModule].quizDone = true;
    moduleStates[currentModule].score = score;
    moduleStates[currentModule].completed = true;
    updateXP();
    updateNav();
    updateGlobalProgress();

    // Check if all done
    const allDone = moduleStates.every(s => s.completed);
    if (allDone) {
      showCompletion();
    } else {
      renderScoreCard();
    }
    showNotif(`Módulo ${currentModule + 1} completado +${score * 20}XP`);
  }
}

function renderScoreCard() {
  const m = modules[currentModule];
  const s = moduleStates[currentModule].score;
  const total = m.quiz.length;
  const pct = Math.round((s / total) * 100);
  const isGood = pct >= 80;
  const next = currentModule + 1;

  document.getElementById('mainContent').innerHTML = `
    <div class="quiz-section">
      <div class="quiz-header">
        <div class="quiz-header-icon">${isGood ? '🏆' : '📊'}</div>
        <div class="quiz-header-text">
          <div class="quiz-header-title">Resultado del Quiz</div>
          <div class="quiz-header-sub">${m.title}</div>
        </div>
      </div>
      <div class="score-card">
        <div class="score-circle">
          <div class="score-num">${s}/${total}</div>
          <div class="score-total">${pct}%</div>
        </div>
        <div class="score-label" style="color:${isGood ? 'var(--green)' : 'var(--yellow)'}">${isGood ? '¡Excelente dominio!' : 'Buen intento'}</div>
        <div class="score-message">${isGood ? 'Demostraste comprensión sólida de los conceptos.' : 'Revisa el video y los conceptos para reforzar los temas.'}</div>
        <div class="badges">
          ${s === total ? '<div class="badge badge-gold">🏆 Perfecto</div>' : ''}
          ${pct >= 80 ? '<div class="badge badge-green">✓ Aprobado</div>' : ''}
          <div class="badge badge-blue">+${s * 20} XP</div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          ${next < modules.length && moduleStates[next - 1].completed ? `<button class="btn btn-success" onclick="loadModule(${next})">→ Módulo ${next + 1}</button>` : ''}
          <button class="btn btn-ghost" onclick="retakeQuiz()">↺ Repetir Quiz</button>
          <button class="btn btn-ghost" onclick="loadModule(${currentModule})">▶ Ver video</button>
        </div>
      </div>
    </div>`;
}

function retakeQuiz() {
  moduleStates[currentModule].quizDone = false;
  quizState = { current: 0, answered: false, selected: null, correctCount: 0 };
  renderQuiz();
}

// ─── COMPLETION ───────────────────────────────────────────────────────────
function showCompletion() {
  const totalScore = moduleStates.reduce((a, s) => a + s.score, 0);
  const totalXP = totalScore * 20;
  document.getElementById('mainContent').innerHTML = `
    <div class="completion-screen show">
      <div class="completion-icon">🚀</div>
      <div class="completion-title">¡Ruta de Aprendizaje Completada!</div>
      <div class="completion-sub">Has completado los 4 módulos de AI Assisted Engineering. Ahora aplica estos conocimientos en tu entorno real de trabajo y comparte tus aprendizajes con el equipo.</div>
      <div class="final-stats">
        <div class="final-stat">
          <div class="final-stat-num">4/4</div>
          <div class="final-stat-label">Módulos</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-num">${totalXP}</div>
          <div class="final-stat-label">XP Total</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-num">${Math.round((totalScore / 40) * 100)}%</div>
          <div class="final-stat-label">Score global</div>
        </div>
      </div>
      <div class="badges" style="justify-content:center;margin-bottom:28px;">
        <div class="badge badge-gold">🏆 AI Engineer</div>
        <div class="badge badge-blue">Claude Code Ready</div>
        <div class="badge badge-green">Copilot Advanced</div>
      </div>
      <button class="btn btn-primary" onclick="location.reload()">↺ Reiniciar ruta</button>
    </div>`;
}

// ─── XP & PROGRESS ────────────────────────────────────────────────────────
function updateXP() {
  const totalXP = moduleStates.reduce((a, s) => a + s.score * 20, 0);
  const maxXP = modules.length * 10 * 20;
  document.getElementById('xpFill').style.width = (totalXP / maxXP * 100) + '%';
  document.getElementById('xpLabel').textContent = `${totalXP} / ${maxXP} XP`;
}

function updateGlobalProgress() {
  const done = moduleStates.filter(s => s.completed).length;
  const pct = (done / modules.length) * 100;
  document.getElementById('globalBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${modules.length} módulos`;
}

// ─── NOTIFICATION ─────────────────────────────────────────────────────────
function showNotif(msg) {
  const el = document.getElementById('notif');
  document.getElementById('notifText').textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── START ────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
